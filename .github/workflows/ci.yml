name: CI (Build, Test, Sanitizers, Static Analysis)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-test:
    name: Release Build & Test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout L3KVG
        uses: actions/checkout@v4
        with:
          path: l3kvg

      - name: Checkout sibling dependencies
        run: |
          mkdir -p lib
          git clone --depth 1 "https://github.com/${{ github.repository_owner }}/L3KV.git" L3KV
          git clone --depth 1 "https://github.com/${{ github.repository_owner }}/lite3-cpp.git" lib/lite3-cpp
          git clone --depth 1 "https://github.com/${{ github.repository_owner }}/liblite3client.git" lib/liblite3client
          git clone --depth 1 https://github.com/ibireme/yyjson.git yyjson

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libzmq3-dev libboost-all-dev libssl-dev

      - name: Configure & Build
        run: |
          cmake -S l3kvg -B l3kvg/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build l3kvg/build -j$(nproc)

      - name: Run CTest
        run: ctest --test-dir l3kvg/build --output-on-failure -j$(nproc)

  sanitizers:
    name: ASan + UBSan (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout L3KVG
        uses: actions/checkout@v4
        with:
          path: l3kvg

      - name: Checkout sibling dependencies
        run: |
          mkdir -p lib
          git clone --depth 1 "https://github.com/${{ github.repository_owner }}/L3KV.git" L3KV
          git clone --depth 1 "https://github.com/${{ github.repository_owner }}/lite3-cpp.git" lib/lite3-cpp
          git clone --depth 1 "https://github.com/${{ github.repository_owner }}/liblite3client.git" lib/liblite3client
          git clone --depth 1 https://github.com/ibireme/yyjson.git yyjson

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libzmq3-dev libboost-all-dev libssl-dev

      - name: Build & Test Core Graph Engine (ASan + UBSan)
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          cmake -S l3kvg -B l3kvg/build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DL3KVG_ENABLE_SANITIZERS=ON
          cmake --build l3kvg/build-asan -j$(nproc) --target \
            test_l3kvg test_adjacency_store test_mutation_batch test_packed_edge test_simd_filter test_binary_edge_wal test_property_index
          ctest --test-dir l3kvg/build-asan \
            -R '^(test_engine|test_adjacency_store|test_mutation_batch|test_packed_edge|test_simd_filter|test_binary_edge_wal|test_property_index)$' \
            --output-on-failure
